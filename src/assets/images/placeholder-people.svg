<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Hintergrund -->
  <rect x="0" y="0" width="600" height="800" fill="#e0e0e0"/>

  <!-- Oberkörper-Silhouette (Kopf + Schultern/Torso) -->
  <g fill="#1a1a1a">
    <!-- Kopf -->
    <circle cx="300" cy="290" r="90"/>

    <!-- Schultern / Oberkörper -->
    <path d="
      M 300 360
      C 210 360, 150 400, 130 470
      C 115 525, 105 590, 100 800
      L 500 800
      C 495 590, 485 525, 470 470
      C 450 400, 390 360, 300 360
      Z"/>
  </g>

  <!-- dezenter Rahmen -->
  <rect x="2" y="2" width="596" height="796" fill="none" stroke="#c8c8c8" stroke-width="4"/>
</svg>
